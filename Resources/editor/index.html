<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'">
<style>
@font-face { font-family: "JetBrains Mono"; src: url("../Fonts/JetBrainsMono.ttf"); font-weight: 100 800; }
:root { --mono: "JetBrains Mono", ui-monospace, Menlo, monospace; --bg: #FBFCFD; --ink: #14181F; --muted: #5F6B7E; --accent: #FF5B2E;
  --active-line: rgba(20,24,31,.04); --selection: rgba(255,91,46,.22);
  --syn-keyword: #B4308A; --syn-string: #0B7A5A; --syn-number: #B25A00; --syn-comment: #5F6B7E; --syn-function: #1F5FBF; --syn-punct: #5F6B7E; }
:root[data-dark="1"] { --active-line: rgba(237,240,245,.05); --selection: rgba(255,107,66,.30);
  --syn-keyword: #F28BD0; --syn-string: #5FDDB0; --syn-number: #F2B063; --syn-comment: #8C97AA; --syn-function: #7DB0FF; --syn-punct: #9AA4B5; }
html, body, #editor { height: 100%; margin: 0; background: var(--bg); }
#editor { position: relative; }
.cm-scroller { scrollbar-width: none; }
.cm-scroller::-webkit-scrollbar { display: none; }
#editor::before, #editor::after { content: ""; position: absolute; left: 0; right: 0; height: 16px; pointer-events: none; z-index: 5; opacity: 0; transition: opacity .12s; }
#editor::before { top: 0; background: linear-gradient(var(--bg), transparent); }
#editor::after { bottom: 0; background: linear-gradient(transparent, var(--bg)); }
#editor.fade-top::before, #editor.fade-bottom::after { opacity: 1; }
</style>
</head>
<body>
<div id="editor"></div>
<script src="editor.js"></script>
</body>
</html>
